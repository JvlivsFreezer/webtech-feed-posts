[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A community blog built with FastAPI, PostgreSQL and Alembic"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.0",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "fastapi[standard]>=0.128.0",
    "greenlet>=3.3.0",
    "markdown-it-py>=4.0.0",
    "nh3>=0.3.7",
    "pillow>=12.1.1",
    "psycopg[binary]>=3.3.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.12.0",
    "pyjwt>=2.10.1",
    "sqlalchemy>=2.0.45",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole run so the shared DB engine's pool stays valid
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
